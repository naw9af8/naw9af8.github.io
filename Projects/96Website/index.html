<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة توحيد المملكة العربية السعودية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<button id="menuBtn" aria-label="قائمة الأحداث" aria-expanded="false" aria-controls="side"><span></span><span></span><span></span></button>
<h1>رحلة توحيد المملكة العربية السعودية</h1>
</header>
<aside id="side" aria-label="الأحداث التاريخية">
<div class="sh"><h2>الأحداث التاريخية</h2><button class="x" id="close" aria-label="إغلاق القائمة">✕</button></div>
<div id="events"></div>
</aside>
<div id="veil"></div>
<main>
<section class="stage">
<div class="card"><img id="mapImage" src="map.svg" alt="خريطة المملكة العربية السعودية"><svg id="map" viewBox="0 0 620 480"></svg></div>
<div class="card info">
<div class="yr" id="yr">1902</div>
<h2 id="ttl"></h2>
<p id="txt"></p>
<div class="cnt" id="cnt"></div>
<div class="bar"><i id="bar"></i></div>
</div>
</section>
<section class="card">
<div class="ctrl">
<button class="btn" id="next">الحدث التالي</button>
<button class="btn" id="play">تشغيل</button>
<button class="btn" id="prev">الحدث السابق</button>
</div>
<input type="range" id="yearSlider" min="1902" max="1932" value="1902" step="1">
<div class="ticks" id="ticks"></div>
<div class="ends"><span>1902</span><span>1932</span></div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
